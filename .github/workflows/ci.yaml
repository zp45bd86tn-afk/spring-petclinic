name: Build, Push, and Update Deployment

on:
  push:
    branches: [ main ]            # main 브랜치에 push 될 때 실행
    paths:                        # 아래 파일이 바뀐 경우에만 실행
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:              # Actions 화면 [Run workflow] 버튼으로 수동 실행

permissions:
  contents: write                 # 4-3 에서 deployment.yaml 을 저장(push)할 권한

env:                              # 아래 Step 들에서 쓰는 공통 값
  AWS_REGION: us-west-2
  ECR_REGISTRY: 884002395647.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: user14-cluster-repo

jobs:
  build:
    runs-on: ubuntu-latest        # GitHub 가 빌려주는 리눅스 가상머신
    steps:
    # ① 소스 가져오기 (= git clone)
    - name: Checkout repository
      uses: actions/checkout@v4

    # ② Java 25 설치 (Maven 라이브러리 캐시로 다음 빌드가 빨라짐)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # ③ 빌드 → target/*.jar 생성 (4-1 STEP 3 과 같은 명령)
    - name: Build with Maven Wrapper
      run: |
        chmod +x ./mvnw
        ./mvnw -B package -DskipTests

    # ④ AWS 인증 (= aws configure, 키는 Secrets 에서)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # ⑤ ECR 로그인 (= docker login)
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    # ⑥ 이미지 빌드 → ECR Push (태그 = 커밋 ID → 어떤 소스로 만든 이미지인지 추적)
    - name: Build, tag, and push image to Amazon ECR
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
